[project]
name = "adp-chat-backend"
version = "0.1.0"
description = "服务 B：腾讯云 ADP 智能体对话网关（SSE 透传，无认证，X-User-Id 白名单）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # asyncio 扩展会带上 greenlet，sqlalchemy 用它做协程切换，缺了就 ImportError
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydash>=8.0",
]

[project.optional-dependencies]
dev = ["ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 120
