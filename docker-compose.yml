services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-adp_chat_b}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-adp_chat_b}']
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      # ADP 密钥 / APP_CONFIGS / SERVICE_VENDOR / SSE_* 都在这里
      - backend/.env
    environment:
      # 容器内用服务名互连，覆盖 backend/.env 里指向宿主机的 PGSQL_HOST
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-adp_chat_b}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 直连调试后端时有用；nginx 代理走的是容器内的 8000
      # 宿主 8000 常被其它服务占用，默认让到 8200
      - '${BACKEND_HOST_PORT:-8200}:8000'
    healthcheck:
      # 镜像里没有 curl，用 python 探测 /health
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
